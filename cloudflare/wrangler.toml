name = "dhobighat-edge-gateway"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
ORIGIN_URL = "https://dhobighat.com"
AUTH_JWT_SECRET = "dhobighat-super-secure-greedy-nerd-jwt-key-2026"

# Free Cloudflare KV Namespace for Master Catalog Caching
# [[kv_namespaces]]
# binding = "CATALOG_KV"
# id = "your-kv-id"

# Free Cloudflare R2 Bucket Binding
# [[r2_buckets]]
# binding = "DHOBIGHAT_R2"
# bucket_name = "dhobighat-assets"

# Nightly DB Backup Cron (02:00 AM UTC)
[triggers]
crons = ["0 2 * * *"]
